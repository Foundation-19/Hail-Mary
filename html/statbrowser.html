<!DOCTYPE html>
<html>
<head>
<title>Stat Browser</title>
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta http-equiv="Cache-Control" content="max-age=15; must-revalidate" />
<link id="goonStyle" rel="stylesheet" type="text/css" href="browserOutput.css" media="all" />
<style>
	/* ── Universal webkit scrollbars ──────────────────────────
	   Applied unconditionally so they work before any theme
	   class is set. scrollbar-color MUST NOT be set on these
	   elements — in Chrome 121+ it replaces webkit scrollbars
	   entirely and ignores all ::-webkit-scrollbar rules. */
	* { box-sizing: border-box; }
	*::-webkit-scrollbar { width: 8px; height: 8px; background: #030a03; }
	*::-webkit-scrollbar-track { background: #030a03; border-left: 1px solid rgba(76,255,76,.08); }
	*::-webkit-scrollbar-thumb { background: rgba(76,255,76,.38); border-radius: 0; border: 1px solid rgba(76,255,76,.15); }
	*::-webkit-scrollbar-thumb:hover { background: rgba(76,255,76,.65); box-shadow: 0 0 4px rgba(76,255,76,.3); }
	*::-webkit-scrollbar-thumb:active { background: #4cff4c; }
	*::-webkit-scrollbar-corner { background: #030a03; }

	body {
		font-family: Verdana, Geneva, Tahoma, sans-serif;
		font-size: 12px !important;
		margin: 0 !important;
		padding: 0 !important;
		overflow-x: hidden;
		overflow-y: scroll;
	}

	body.dark {
		background-color: #131313;
		color: #b2c4dd;
		scrollbar-base-color: #1c1c1c;
		scrollbar-face-color: #3b3b3b;
		scrollbar-3dlight-color: #252525;
		scrollbar-highlight-color: #252525;
		scrollbar-track-color: #1c1c1c;
		scrollbar-arrow-color: #929292;
		scrollbar-shadow-color: #3b3b3b;
	}

	#menu {
		background-color: #F0F0F0;
		position: fixed;
		width: 100%;
		z-index: 100;
	}

	.dark #menu {
		background-color: #202020;
	}

	#statcontent {
		padding: 7px 7px 7px 7px;
	}

	a {
		color: black;
		text-decoration: none
	}

	.dark a {
		color: #b2c4dd;
	}

	a:hover, .dark a:hover {
		text-decoration: underline;
	}

	ul {
		list-style-type: none;
		margin: 0;
		padding: 0;
		background-color: #333;
	}

	li {
		float: left;
	}

	li a {
		display: block;
		color: white;
		text-align: center;
		padding: 14px 16px;
		text-decoration: none;
	}

	li a:hover:not(.active) {
		background-color: #111;
	}

	.button-container {
		display: inline-flex;
		flex-wrap: wrap-reverse;
		flex-direction: row;
		align-items: flex-start;
		overflow-x: hidden;
		white-space: pre-wrap;
		padding: 0 4px;
	}

	.button {
		background-color: #dfdfdf;
		border: 1px solid #cecece;
		border-bottom-width: 2px;
		color: rgba(0, 0, 0, 0.7);
		padding: 6px 4px 4px;
		text-align: center;
		text-decoration: none;
		font-size: 12px;
		margin: 0;
		cursor: pointer;
		transition-duration: 100ms;
		order: 3;
		min-width: 40px;
	}

	.dark button {
		background-color: #222222;
		border-color: #343434;
		color: rgba(255, 255, 255, 0.5);
	}

	.button:hover {
		background-color: #ececec;
		transition-duration: 0;
	}

	.dark button:hover {
		background-color:  #2e2e2e;
	}

	.button:active, .button.active {
		background-color: #ffffff;
		color: black;
		border-top-color: #cecece;
		border-left-color: #cecece;
		border-right-color: #cecece;
		border-bottom-color: #ffffff;
	}

	.dark .button:active, .dark .button.active {
		background-color: #444444;
		color: white;
		border-top-color: #343434;
		border-left-color: #343434;
		border-right-color: #343434;
		border-bottom-color: #ffffff;
	}

	.grid-container {
		margin: -2px;
		margin-right: -15px;
	}

	.grid-item {
		position: relative;
		display: inline-block;
		width: 100%;
		box-sizing: border-box;
		overflow: visible;
		padding: 3px 2px;
		text-decoration: none;
	}

	@media only screen and (min-width: 300px) {
		.grid-item {
			width: 50%;
		}
	}

	@media only screen and (min-width: 430px) {
		.grid-item {
			width: 33%;
		}
	}

	@media only screen and (min-width: 560px) {
		.grid-item {
			width: 25%;
		}
	}

	@media only screen and (min-width: 770px) {
		.grid-item {
			width: 20%;
		}
	}

	.grid-item:hover {
		z-index: 1;
	}

	.grid-item:hover .grid-item-text {
		width: auto;
		text-decoration: underline;
	}

	.grid-item-text {
		display: inline-block;
		width: 100%;
		background-color: #ffffff;
		margin: 0 -6px;
		padding: 0 6px;
		white-space: nowrap;
		overflow: hidden;
		text-overflow: ellipsis;
		pointer-events: none;
	}

	.dark .grid-item-text {
		background-color: #131313;
	}

	.link {
		display: inline;
		background: none;
		border: none;
		padding: 7px 14px;
		color: black;
		text-decoration: none;
		cursor: pointer;
		font-size: 13px;
		margin: 2px 2px;
	}

	.dark .link {
		color: #abc6ec;
	}

	.link:hover {
		text-decoration: underline;
	}

	img {
		-ms-interpolation-mode: nearest-neighbor;
		image-rendering: pixelated;
	}

	.interview_panel_controls, .interview_panel_stats {
		margin-bottom: 10px;
	}

	/* ═══════════════════════════════════════════════════════════
		FALLOUT / ROBCO INDUSTRIES UNIFIED OPERATING SYSTEM v7.1.0
	   ═══════════════════════════════════════════════════════════ */

	@keyframes crt-flicker {
		0%, 87%, 89%, 97%, 99%, 100% { background: rgba(0,0,0,0); }
		88% { background: rgba(0,0,0,0.13); }
		98% { background: rgba(0,0,0,0.07); }
	}

	@keyframes phosphor-pulse {
		0%, 100% { text-shadow: 0 0 4px rgba(76, 255, 76, 0.55), 0 0 10px rgba(76, 255, 76, 0.2); }
		50%       { text-shadow: 0 0 6px rgba(76, 255, 76, 0.85), 0 0 14px rgba(76, 255, 76, 0.35); }
	}

	body.fallout {
		background-color: #050c05;
		color: #a0d0a0;
		font-family: 'Courier New', Courier, monospace;
		font-size: 12px !important;
		/* IE/legacy scrollbar */
		scrollbar-base-color: #030a03;
		scrollbar-face-color: #1a4a1a;
		scrollbar-3dlight-color: #030a03;
		scrollbar-highlight-color: #030a03;
		scrollbar-track-color: #030a03;
		scrollbar-arrow-color: #4cff4c;
		scrollbar-shadow-color: #0a2a0a;
		/* NOTE: scrollbar-color NOT set here — Chrome 121+ uses it
			instead of ::-webkit-scrollbar, ignoring our custom thumb
			styling. Use the universal *::-webkit-scrollbar above. */
	}

	/* CRT flicker overlay — darkens instead of going transparent
	   so the BYOND window background never bleeds through */
	#crt-overlay {
		display: none;
	}
	.fallout #crt-overlay {
		display: block;
		position: fixed;
		top: 0; left: 0;
		width: 100%; height: 100%;
		background: rgba(0,0,0,0);
		pointer-events: none;
		z-index: 10000;
		animation: crt-flicker 14s infinite;
	}

	/* CRT scanlines */
	body.fallout::after {
		content: '';
		position: fixed;
		top: 0; left: 0;
		width: 100%; height: 100%;
		background: repeating-linear-gradient(
			0deg,
			transparent,
			transparent 2px,
			rgba(0, 0, 0, 0.045) 2px,
			rgba(0, 0, 0, 0.045) 4px
		);
		pointer-events: none;
		z-index: 9999;
	}

	/* CRT edge vignette */
	body.fallout::before {
		content: '';
		position: fixed;
		top: 0; left: 0;
		width: 100%; height: 100%;
		background: radial-gradient(ellipse at center, transparent 65%, rgba(0, 0, 0, 0.55) 100%);
		pointer-events: none;
		z-index: 9998;
	}

	.fallout #menu {
		background: #030a03;
		border-bottom: 1px solid rgba(76, 255, 76, 0.22);
		padding: 3px 4px;
		box-shadow: 0 1px 10px rgba(76, 255, 76, 0.07), inset 0 -1px 0 rgba(76, 255, 76, 0.1);
	}

	.fallout .button {
		background: #020802;
		border: 1px solid rgba(76, 255, 76, 0.18);
		border-bottom-width: 2px;
		color: rgba(76, 255, 76, 0.45);
		font-family: 'Courier New', Courier, monospace;
		font-size: 10px;
		letter-spacing: 0.07em;
		text-transform: uppercase;
		padding: 4px 9px 3px;
		margin: 1px;
		cursor: pointer;
		transition: color 80ms, border-color 80ms, background 80ms, text-shadow 80ms;
	}

	.fallout .button:hover {
		background: #071507;
		color: rgba(76, 255, 76, 0.82);
		text-shadow: 0 0 5px rgba(76, 255, 76, 0.5);
		border-color: rgba(76, 255, 76, 0.38);
	}

	.fallout .button.active {
		background: #071a07;
		color: #4cff4c;
		text-shadow: 0 0 6px rgba(76, 255, 76, 0.9), 0 0 14px rgba(76, 255, 76, 0.4);
		border-color: rgba(76, 255, 76, 0.6);
		border-bottom-color: #050c05;
		animation: phosphor-pulse 2.5s ease-in-out infinite;
	}

	.fallout #statcontent {
		padding: 8px 10px;
		font-family: 'Courier New', Courier, monospace;
		font-size: 12px;
		line-height: 1.65;
		color: #a0d0a0;
	}

	.fallout a {
		color: #4cff4c;
		text-decoration: none;
	}

	.fallout a:hover {
		color: #c8ffc8;
		text-shadow: 0 0 5px rgba(76, 255, 76, 0.65);
		text-decoration: none;
	}

	.fallout table {
		width: 100%;
		border-collapse: collapse;
	}

	.fallout td {
		padding: 2px 6px;
		border-bottom: 1px solid rgba(76, 255, 76, 0.07);
		color: #a0d0a0;
	}

	.fallout td:first-child {
		color: rgba(76, 255, 76, 0.5);
		white-space: nowrap;
		padding-right: 14px;
	}

	/* term-table: MC, tickets, spells */
	.fallout .term-table {
		width: 100%;
		border-collapse: collapse;
	}

	.fallout .term-table td:first-child {
		color: rgba(76, 255, 76, 0.45);
		font-size: 10px;
		text-transform: uppercase;
		letter-spacing: 0.05em;
		padding-right: 16px;
		width: 1%;
		white-space: nowrap;
		border-right: 1px solid rgba(76, 255, 76, 0.12);
	}

	.fallout .term-table td:last-child {
		padding-left: 12px;
		color: #a0d0a0;
	}

	.fallout .term-table tr:hover td {
		background: rgba(76, 255, 76, 0.04);
	}

	.fallout h3 {
		color: #4cff4c;
		font-family: 'Courier New', Courier, monospace;
		font-size: 10px;
		font-weight: bold;
		text-transform: uppercase;
		letter-spacing: 0.14em;
		margin: 10px 0 4px;
		padding-bottom: 3px;
		border-bottom: 1px solid rgba(76, 255, 76, 0.28);
		text-shadow: 0 0 5px rgba(76, 255, 76, 0.4);
	}

	/* ROBCO terminal header */
	#robco-header {
		display: none;
	}

	.fallout #robco-header {
		display: block;
		background: #030a03;
		padding: 3px 10px 3px;
		border-bottom: 1px solid rgba(76, 255, 76, 0.2);
		font-family: 'Courier New', Courier, monospace;
		font-size: 9px;
		color: rgba(76, 255, 76, 0.5);
		letter-spacing: 0.14em;
		text-transform: uppercase;
		text-shadow: 0 0 4px rgba(76, 255, 76, 0.3);
		z-index: 99;
		position: relative;
		animation: header-fadein 0.3s ease-in both;
	}

	#robco-corp {
		display: inline-block;
		overflow: hidden;
		white-space: nowrap;
		vertical-align: bottom;
		max-width: 0;
	}

	.fallout #robco-corp {
		animation: typewriter-robco 1.5s steps(40, end) 0.15s both;
	}

	#robco-cursor {
		display: none;
	}

	.fallout #robco-cursor {
		display: inline-block;
		color: #4cff4c;
		text-shadow: 0 0 5px rgba(76, 255, 76, 0.8);
		margin-left: 2px;
		animation: blink-caret 1.1s step-end infinite;
	}

	@keyframes blink-caret {
		0%, 100% { opacity: 1; }
		50%       { opacity: 0; }
	}

	@keyframes typewriter-robco {
		from { max-width: 0; }
		to   { max-width: 100%; }
	}

	@keyframes header-fadein {
		from { opacity: 0; }
		to   { opacity: 1; }
	}

	/* Terminal status lines */
	.fallout .term-section-hdr {
		color: #4cff4c;
		font-family: 'Courier New', Courier, monospace;
		font-size: 10px;
		font-weight: bold;
		text-transform: uppercase;
		letter-spacing: 0.18em;
		text-shadow: 0 0 6px rgba(76, 255, 76, 0.55);
		padding: 6px 0 4px;
		margin-bottom: 4px;
		border-bottom: 1px solid rgba(76, 255, 76, 0.3);
	}

	.fallout .term-entry {
		padding: 1px 0;
		line-height: 1.65;
	}

	.fallout .term-entry::before {
		content: '> ';
		color: rgba(76, 255, 76, 0.32);
	}

	.fallout .term-sep {
		height: 0;
		border: none;
		border-top: 1px solid rgba(76, 255, 76, 0.1);
		margin: 4px 0;
	}

	/* Verb grid → terminal block list */
	.fallout .grid-container {
		columns: 2;
		column-gap: 0;
		display: block !important;
	}

	.fallout .grid-item {
		display: block !important;
		width: 100% !important;
		padding: 1px 4px 1px 16px !important;
		position: relative;
		break-inside: avoid;
	}

	.fallout .grid-item::before {
		content: '>';
		position: absolute;
		left: 3px;
		color: #4cff4c;
		font-weight: bold;
		text-shadow: 0 0 3px rgba(76, 255, 76, 0.5);
	}

	.fallout .grid-item-text {
		background: transparent;
		color: #a0d0a0;
		font-family: 'Courier New', Courier, monospace;
		font-size: 12px;
		white-space: nowrap;
		overflow: hidden;
		text-overflow: ellipsis;
	}

	.fallout .grid-item:hover .grid-item-text {
		color: #c8ffc8;
		text-shadow: 0 0 6px rgba(76, 255, 76, 0.6);
		background: rgba(76, 255, 76, 0.04);
	}

	.fallout .link {
		color: #4cff4c;
		font-family: 'Courier New', Courier, monospace;
		font-size: 12px;
		padding: 3px 0;
		background: none;
		border: none;
	}

	.fallout .link:hover {
		color: #c8ffc8;
		text-shadow: 0 0 5px rgba(76, 255, 76, 0.65);
	}

	.fallout .interview_panel_controls,
	.fallout .interview_panel_stats {
		color: #a0d0a0;
		margin-bottom: 8px;
	}

	.fallout .interview_panel_table td {
		color: #4cff4c;
	}

	/* Webkit scrollbar styling — target html AND body (both with class), AND all descendants.
	   NOTE: scrollbar-width:thin DISABLES ::-webkit-scrollbar in Chromium/WebView2
	   so we do NOT set that property on body.fallout.
	   In Chromium the document-level scrollbar lives on <html>, not <body>. */
	html.fallout::-webkit-scrollbar,
	body.fallout::-webkit-scrollbar,
	.fallout ::-webkit-scrollbar {
		width: 8px;
		height: 8px;
		background: #030a03;
	}

	html.fallout::-webkit-scrollbar-track,
	body.fallout::-webkit-scrollbar-track,
	.fallout ::-webkit-scrollbar-track {
		background: #030a03;
		border-left: 1px solid rgba(76, 255, 76, 0.08);
	}

	html.fallout::-webkit-scrollbar-thumb,
	body.fallout::-webkit-scrollbar-thumb,
	.fallout ::-webkit-scrollbar-thumb {
		background: rgba(76, 255, 76, 0.38);
		border-radius: 0;
		border: 1px solid rgba(76, 255, 76, 0.15);
	}

	html.fallout::-webkit-scrollbar-thumb:hover,
	body.fallout::-webkit-scrollbar-thumb:hover,
	.fallout ::-webkit-scrollbar-thumb:hover {
		background: rgba(76, 255, 76, 0.65);
		box-shadow: 0 0 4px rgba(76, 255, 76, 0.3);
	}

	html.fallout::-webkit-scrollbar-thumb:active,
	body.fallout::-webkit-scrollbar-thumb:active,
	.fallout ::-webkit-scrollbar-thumb:active {
		background: #4cff4c;
	}

	html.fallout::-webkit-scrollbar-corner,
	body.fallout::-webkit-scrollbar-corner,
	.fallout ::-webkit-scrollbar-corner {
		background: #030a03;
	}

	/* ── Boot sequence ─────────────────────────────────────────── */
	#boot-seq {
		display: none;
	}

	.fallout #boot-seq {
		display: block;
		font-family: 'Courier New', Courier, monospace;
		font-size: 0.72em;
		color: rgba(76, 255, 76, 0.55);
		padding: 2px 10px 4px;
		line-height: 1.55;
		letter-spacing: 0.03em;
		overflow: hidden;
		animation: boot-appear 0.4s ease-out 0.3s both, boot-vanish 0.35s ease-in 3.6s forwards;
	}

	@keyframes boot-appear {
		from { opacity: 0; max-height: 0; padding-top: 0; padding-bottom: 0; }
		to   { opacity: 1; max-height: 90px; padding-top: 2px; padding-bottom: 4px; }
	}

	@keyframes boot-vanish {
		from { opacity: 1; max-height: 90px; padding-top: 2px; padding-bottom: 4px; }
		to   { opacity: 0; max-height: 0; padding-top: 0; padding-bottom: 0; }
	}

	/* ── Status entry severity classes ─────────────────────────── */
	.fallout .term-entry-danger {
		color: #ff5c5c !important;
		text-shadow: 0 0 4px rgba(255, 50, 50, 0.3);
	}

	.fallout .term-entry-warn {
		color: #c8b428 !important;
		text-shadow: 0 0 3px rgba(200, 180, 40, 0.2);
	}

	.fallout .term-entry-ok {
		color: #4cff4c !important;
		text-shadow: 0 0 3px rgba(76, 255, 76, 0.3);
	}

	/* ── Grid-item active / click flash ─────────────────────────── */
	.fallout .grid-item:active .grid-item-text {
		color: #4cff4c !important;
		text-shadow: 0 0 10px rgba(76, 255, 76, 0.9);
	}
</style>
</head>

// Status panel implementation ------------------------------------------------
var status_tab_parts = ["Loading..."];
var current_tab = null;
var mc_tab_parts = [["Loading...", ""]];
var href_token = null;
var spells = [];
var spell_tabs = [];
var verb_tabs = [];
var verbs = [["", ""]]; // list with a list inside
var tickets = [];
var interviewManager = {status: "", interviews: []};
var sdql2 = [];
var permanent_tabs = []; // tabs that won't be cleared by wipes
var turfcontents = [];
var turfname = "";
var imageRetryDelay = 500;
var imageRetryLimit = 50;
var menu = document.getElementById('menu');
var under_menu = document.getElementById('under_menu');
var statcontentdiv = document.getElementById('statcontent');
var storedimages = [];
var split_admin_tabs = false;

var connected = false;
var commandQueue = [];

// Any BYOND verb call must go through this, as if a verb is sent during reconnect then
// it will cause the reconnect to fail.
// This function will either call immediately, or queue until
// BYOND confirms we are connected.
function send_byond_command(command) {
	var href = "byond://winset?command=" + command;

	if (connected) {
		window.location.href = href;
	} else {
		commandQueue.push(href);
	}
}

// Any BYOND commands that could result in the client's focus changing go through this
// to ensure that when we relinquish our focus, we don't do it after the result of
// a command has already taken focus for itself.
function run_after_focus(callback) {
	setTimeout(callback, 0);
}

function connected_to_server() {
	if (connected) {
		return;
	}

	connected = true;

	for (var index = 0; index < commandQueue.length; index++) {
		// This is just setting it a lot, is this not going to cancel?
		window.location.href = commandQueue[index];
	}

	commandQueue = [];
}

function update_split_admin_tabs(status) {
	status = (status == true);

	if (split_admin_tabs !== status) {
		if (split_admin_tabs === true) {
			removeStatusTab("Events");
			removeStatusTab("Fun");
			removeStatusTab("Game");
		}
		update_verbs();
	}
	split_admin_tabs = status;
}

function createStatusTab(name) {
	if (name.indexOf(".") != -1) {
		var splitName = name.split(".");
		if (split_admin_tabs && splitName[0] === "Admin")
			name = splitName[1];
		else
			name = splitName[0];
	}
	if(document.getElementById(name) || name.trim() == "")
		return;
	if(!verb_tabs.includes(name) && !permanent_tabs.includes(name))
		return;
	var B = document.createElement("BUTTON");
	B.onclick = function() {
		tab_change(name);
		this.blur();
	};
	B.id = name;
	B[textContentKey] = name;
	B.className = "button";
	//ORDERING ALPHABETICALLY
	B.style.order = name.charCodeAt(0);
	if(name == "Status" || name == "MC")
		B.style.order = name == "Status" ? 1 : 2;
	//END ORDERING
	menu.appendChild(B);
	SendTabToByond(name);
	under_menu.style.height = menu.clientHeight + 'px';
}

function removeStatusTab(name) {
	if(!document.getElementById(name) || permanent_tabs.includes(name))
		return;
	for (var i = verb_tabs.length - 1; i >= 0; --i) {
		if (verb_tabs[i] == name) {
			verb_tabs.splice(i, 1);
		}
	}
	menu.removeChild(document.getElementById(name));
	TakeTabFromByond(name);
	under_menu.style.height = menu.clientHeight + 'px';
}

function sortVerbs() {
	verbs.sort(function (a, b) {
		var selector = a[0] == b[0] ? 1 : 0;
		if (a[selector].toUpperCase() < b[selector].toUpperCase()) {
			return 1;
		}
		else if (a[selector].toUpperCase() > b[selector].toUpperCase()) {
			return -1;
		}
		return 0;
	})
}

window.onresize = function () {
	under_menu.style.height = menu.clientHeight + 'px';
}

function addPermanentTab(name) {
	if(!permanent_tabs.includes(name))
		permanent_tabs.push(name);
	createStatusTab(name);
}

function removePermanentTab(name) {
	for (var i = permanent_tabs.length - 1; i >= 0; --i) {
		if (permanent_tabs[i] == name) {
			permanent_tabs.splice(i, 1);
		}
	}
	removeStatusTab(name);
}

function checkStatusTab() {
	// Iterate backwards to avoid skipping elements when removing
	for(var i = menu.children.length - 1; i >= 0; i--) {
		var child = menu.children[i];
		if(child.id && !verb_tabs.includes(child.id) && !permanent_tabs.includes(child.id))
			menu.removeChild(child);
	}
}

function remove_verb(v) {
	var verb_to_remove = v; // to_remove = [verb:category, verb:name]
	for(var i = verbs.length - 1; i >= 0; i--){
		var part_to_remove = verbs[i];
		if(part_to_remove[1] == verb_to_remove[1]){
			verbs.splice(i, 1)
		}
	}
}

function check_verbs() {
	for(var v = verb_tabs.length - 1; v >= 0; v--){
		verbs_cat_check(verb_tabs[v]);
	}
}

function verbs_cat_check(cat) {
	var tabCat = cat;
	if (cat.indexOf(".") != -1) {
		var splitName = cat.split(".");
		if (split_admin_tabs && splitName[0] === "Admin")
			tabCat = splitName[1];
		else
			tabCat = splitName[0];
	}
	var verbs_in_cat = 0;
	var verbcat = "";
	if(!verb_tabs.includes(tabCat)){
		removeStatusTab(tabCat);
		return;
	}
	for(var v = 0; v < verbs.length; v++){
		var part = verbs[v];
		verbcat = part[0];
		if (verbcat.indexOf(".") != -1) {
			var splitName = verbcat.split(".");
			if (split_admin_tabs && splitName[0] === "Admin")
				verbcat = splitName[1];
			else
				verbcat = splitName[0];
		}
		if(verbcat != tabCat || verbcat.trim() == ""){
			continue;
		}
		else{
			verbs_in_cat = 1;
			break; // we only need one
		}
	}
	if(verbs_in_cat != 1) {
		removeStatusTab(tabCat);
		if(current_tab == tabCat)
			tab_change("Status");
	}
}

function findVerbindex(name, verblist) {
	for(var i = 0; i < verblist.length; i++) {
		var part = verblist[i];
		if(part[1] == name)
			return i;
	}
}
function wipe_verbs() {
	verbs = [["", ""]];
	verb_tabs = [];
	checkStatusTab(); // remove all empty verb tabs
}

function update_verbs() {
	wipe_verbs();
	send_byond_command("Update-Verbs");
}

function add_verb_list(v) {
	var to_add = JSON.parse(v); // list of a list with category and verb inside it
	to_add.sort(); // sort what we're adding
	for(var i = 0; i < to_add.length; i++) {
		var part = to_add[i];
		if(!part[0])
			continue;
		var category = part[0];
		if (category.indexOf(".") != -1) {
			var splitName = category.split(".");
			if (split_admin_tabs && splitName[0] === "Admin")
				category = splitName[1];
			else
				category = splitName[0];
		}
		if(findVerbindex(part[1], verbs))
			continue;
		if(verb_tabs.includes(category)){
			verbs.push(part);
			if(current_tab == category) {
				draw_verbs(category); // redraw if we added a verb to the tab we're currently in
			}
		} else if(category) {
			verb_tabs.push(category);
			verbs.push(part);
			createStatusTab(category);
		}
	}
}

function remove_verb_list(v) {
	var to_remove = JSON.parse(v);
	for(var i = 0; i < to_remove.length; i++) {
		remove_verb(to_remove[i]);
	}
	check_verbs();
	sortVerbs();
	if(verb_tabs.includes(current_tab))
		draw_verbs(current_tab);
}

// passes a 2D list of (verbcategory, verbname) creates tabs and adds verbs to respective list
// example (IC, Say)
function init_verbs(c, v) {
	connected_to_server();
	wipe_verbs(); // remove all verb categories so we can replace them
	checkStatusTab(); // remove all status tabs
	verb_tabs = JSON.parse(c);
	verb_tabs.sort(); // sort it
	var do_update = false;
	var cat = "";
	for(var i = 0; i < verb_tabs.length; i++){
		cat = verb_tabs[i];
		createStatusTab(cat); // create a category if the verb doesn't exist yet
	}
	if(verb_tabs.includes(current_tab)) {
		do_update = true;
	}
	if(v) {
		add_verb_list(v);
		sortVerbs(); // sort them
		if(do_update) {
			draw_verbs(current_tab);
		}
	}
	// In BYOND 516 with Chromium/WebView2, delay SendTabsToByond to ensure bridge is ready
	// This prevents tabs from becoming empty during lobby/reconnect scenarios
	if (window.BLINK !== null) {
		setTimeout(function() {
			SendTabsToByond();
		}, 100);
	} else {
		SendTabsToByond();
	}
}

function SendTabsToByond(){
	var tabstosend = [];
	tabstosend = tabstosend.concat(permanent_tabs, verb_tabs);
	for(var i=0; i < tabstosend.length; i++){
		SendTabToByond(tabstosend[i]);
	}
}

function tab_change(tab) {

/**
 * Returns the appropriate term-entry CSS class string based on the
 * content of a status line. Used to colour-code the Status tab.
 */
function getTermEntryClass(text) {
	var lower = text.toLowerCase();
	if (/\bcritical\b|offline|\bfail|error\b|\bdead\b|\bzero\b|disconnected|unavailable/.test(lower)) {
		return 'term-entry term-entry-danger';
	}
	if (/warning|caution|\blow\b|delay|lag|unusual|attention|poor/.test(lower)) {
		return 'term-entry term-entry-warn';
	}
	if (/\bok\b|ready|online|active|running|normal|pass|connected/.test(lower)) {
		return 'term-entry term-entry-ok';
	}
	return 'term-entry';
}

function iconError() {
	var that = this;
	setTimeout(function() {
		var current_attempts = that.id; // a bit of a hack, change this if we need to call on img id's later
		if(!current_attempts)
			that.id = 1;
		if (current_attempts > imageRetryLimit)
			return;
		var src = that.src;
		that.src = null;
		that.src = src + '#' + current_attempts;
		that.id++;
		draw_listedturf();
	}, imageRetryDelay);
}
function draw_listedturf() {
	statcontentdiv[textContentKey] = "";
	var table = document.createElement("table");
	for(var i = 0; i < turfcontents.length; i++) {
		var part = turfcontents[i];
		if(storedimages[part[1]] == null && part[2]) {
			var img = document.createElement("img");
			img.src = part[2];
			img.id = part[1];
			storedimages[part[1]] = part[2];
			img.onerror = function() {
				iconError();
			};
			table.appendChild(img);
		} else {
			var img = document.createElement("img");
			img.onerror = function() {
				iconError();
			};
			img.src = storedimages[part[1]];
			img.id = part[1];
			table.appendChild(img);
		}
		var b = document.createElement("div");
		var clickcatcher = "";
		b.className = "link";
		b.onmousedown = function (part) {
			// The outer function is used to close over a fresh "part" variable,
			// rather than every onmousedown getting the "part" of the last entry.
			return function(e) {
				e.preventDefault();
				clickcatcher = "?src=" + part[1];
				switch(e.button){
					case 1:
						clickcatcher += ";statpanel_item_click=middle"
						break;
					case 2:
						clickcatcher += ";statpanel_item_click=right"
						break;
					default:
						clickcatcher += ";statpanel_item_click=left"
				}
				if(e.shiftKey){
					clickcatcher += ";statpanel_item_shiftclick=1";
				}
				if(e.ctrlKey){
					clickcatcher += ";statpanel_item_ctrlclick=1";
				}
				if(e.altKey) {
					clickcatcher += ";statpanel_item_altclick=1";
				}
				window.location.href = clickcatcher;
			}
		}(part);
		b[textContentKey] = part[0];
		table.appendChild(b);
		table.appendChild(document.createElement("br"));
	}
	document.getElementById("statcontent").appendChild(table);
}

function make_verb_onclick(command) {
	return function() {
		run_after_focus(function() {
			send_byond_command(command);
		});
	};
}

function draw_verbs(cat){
	statcontentdiv[textContentKey] = "";
	var isFallout = document.body.className === 'fallout';
	if(isFallout) {
		var vhdr = document.createElement('div');
		vhdr.className = 'term-section-hdr';
		vhdr[textContentKey] = '[ ' + cat.toUpperCase() + ' ]';
		document.getElementById('statcontent').appendChild(vhdr);
	}
	var table = document.createElement("div");
	var additions = {}; // additional sub-categories to be rendered
	table.className = "grid-container";
	sortVerbs();
	if (split_admin_tabs && cat.lastIndexOf(".") != -1) {
		var splitName = cat.split(".");
		if (splitName[0] === "Admin")
			cat = splitName[1];
	}
	verbs.reverse(); // sort verbs backwards before we draw
	for (var i = 0; i < verbs.length; ++i) {
		var part = verbs[i];
		var name = part[0];
		if (split_admin_tabs && name.lastIndexOf(".") != -1) {
			var splitName = name.split(".");
			if (splitName[0] === "Admin")
				name = splitName[1];
		}
		var command = part[1];

		if (command && name.lastIndexOf(cat, 0) != -1 && (name.length == cat.length || name.charAt(cat.length) == ".")) {
			var subCat = name.lastIndexOf(".") != -1 ? name.split(".")[1] : null;
			if (subCat && !additions[subCat]) {
				var newTable = document.createElement("div");
				newTable.className = "grid-container";
				additions[subCat] = newTable;
			}

			var a = document.createElement("a");
			a.href = "#"
			a.onclick = make_verb_onclick(command.replace(/\s/g, "-"));
			a.className = "grid-item";
			var t = document.createElement("span");
			t[textContentKey] = command;
			t.className = "grid-item-text";
			a.appendChild(t);
			(subCat ? additions[subCat] : table).appendChild(a);
		}
	}

	// Append base table to view
	var content = document.getElementById("statcontent");
	content.appendChild(table);

	// Append additional sub-categories if relevant
	for (var cat in additions) {
		if (additions.hasOwnProperty(cat)) {
			// do addition here
			var header = document.createElement("h3");
			header[textContentKey] = cat;
			content.appendChild(header);
			content.appendChild(additions[cat]);
		}
	}
}

function set_theme(which) {
	if (which == "light") {
		document.documentElement.className = "";
		document.body.className = "";
		set_style_sheet("browserOutput_white");
	} else if (which == "fallout") {
		document.documentElement.className = "fallout";
		document.body.className = "fallout";
		set_style_sheet("browserOutput");
	} else {
		document.documentElement.className = "dark";
		document.body.className = "dark";
		set_style_sheet("browserOutput");
	}
}

function set_style_sheet(sheet) {
	var currentSheet = document.getElementById("goonStyle");
	// Skip the reload entirely if this stylesheet is already active — prevents flash
	if(currentSheet && currentSheet.href && currentSheet.href.indexOf(sheet + ".css") !== -1) {
		return;
	}
	if(currentSheet) {
		currentSheet.parentElement.removeChild(currentSheet);
	}
	var head  = document.getElementsByTagName('head')[0];
	var sheetElement = document.createElement("link");
	sheetElement.id = "goonStyle";
	sheetElement.rel = "stylesheet";
	sheetElement.type = "text/css";
	sheetElement.href = sheet + ".css";
	sheetElement.media = 'all';
	head.appendChild(sheetElement);
}

function getCookie(cname) {
	var name = cname + '=';
	var ca = document.cookie.split(';');
	for(var i=0; i < ca.length; i++) {
	var c = ca[i];
	while (c.charAt(0)==' ') c = c.substring(1);
		if (c.indexOf(name) === 0) {
			return decoder(c.substring(name.length,c.length));
		}
	}
	return '';
}
